<!--
  Group-booking deposits — every deposit, upcoming above past.

  staff-site#154, spec vouchers#100. Read-only: nothing on this page can
  change a booking or a payment. The rows come from GET /v1/staff/deposits
  through the portal's payments proxy; grouping, ordering and every cell's
  text are decided in deposits/logic.js, which is unit tested. This file is
  not.

  Bump the `?v=` below whenever deposits/logic.js gains or renames an export.
  There is no build step — a browser holding an earlier copy of the module
  serves it against newer HTML, and Alpine swallows the failure one expression
  at a time, so the page renders with no rows. The boot check in init() turns
  that into a message.
-->
<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Group booking deposits - staff portal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%238b1c23'/%3E%3Cg%20fill='none'%20stroke='%23fff'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Crect%20x='4'%20y='7'%20width='16'%20height='11'%20rx='2'/%3E%3Cpath%20d='M4%2011h16M8%2015h3'/%3E%3C/g%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            uj: { DEFAULT: '#8b1c23', dark: '#6b181e', light: '#ab2930' }
          },
          fontFamily: {
            sans: ['"Inter"', '"Segoe UI"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          borderRadius: {
            card: '18px',
          }
        }
      }
    }
  </script>
  <!-- Module scripts are deferred and deferred scripts run in document order,
       so this sits ABOVE the Alpine tag deliberately: window.depositLogic
       exists before any expression evaluates. Same seam as
       vouchers/unsubscribes.html. -->
  <script type="module">
    import * as logic from './deposits/logic.js?v=1';
    window.depositLogic = logic;
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    /* Design tokens and the header shell are lifted from
       vouchers/unsubscribes.html so the portal pages read as one tool. */
    :root {
      --uj: #8b1c23;
      --border-soft: rgba(31, 41, 55, 0.08);

      --ink-primary:   #111827;
      --ink-secondary: #4b5563;
      --ink-muted:     #817476;
      --surface:       #ffffff;
    }

    .hub-header {
      background:
        radial-gradient(circle at 20% -20%, rgba(171, 49, 57, 0.32), transparent 55%),
        linear-gradient(145deg, rgba(107, 24, 30, 0.95), rgba(139, 28, 35, 0.92));
    }
    .panel {
      background: #fff;
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      box-shadow: 0 12px 30px -24px rgba(15, 23, 42, 1);
      padding: 28px 32px;
    }
    .header-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      color: var(--uj);
      background: linear-gradient(135deg, #f4d4d8, #e0a9b0);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.55);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .nav-icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
    .nav-icon svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .notice {
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.82rem;
      line-height: 1.55;
    }
    .notice-error { background: rgba(159, 47, 56, 0.08); color: #7f1d1d; border: 1px solid rgba(159, 47, 56, 0.20); }

    /* One table per group. Nine columns at desktop width; on a phone each row
       becomes a card with the column heading in front of every value. */
    .deposits { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .deposits th {
      text-align: left;
      font-size: 0.67rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      padding: 0 10px 8px;
      white-space: nowrap;
    }
    .deposits td {
      padding: 10px;
      border-top: 1px solid var(--border-soft);
      vertical-align: top;
      color: var(--ink-secondary);
    }
    .deposits td.paid { white-space: nowrap; }
    .deposits td.organiser { color: var(--ink-primary); font-weight: 600; }
    .deposits td.money { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .deposits td.session { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.74rem; word-break: break-all; }
    .deposits a { color: var(--uj); text-decoration: underline; text-underline-offset: 2px; }
    .deposits .cell-label { display: none; }
    .deposits tr.unrecorded td { background: rgba(192, 132, 48, 0.07); }
    .problem { display: block; color: #8a5c17; font-weight: 500; }
    .state-unsent { color: #8a5c17; }
    .state-na { color: var(--ink-muted); }

    @media (max-width: 720px) {
      .panel { padding: 20px 16px; border-radius: 16px; }

      .deposits thead { display: none; }
      .deposits, .deposits tbody, .deposits tr, .deposits td { display: block; }
      .deposits tr {
        border: 1px solid var(--border-soft);
        border-radius: 14px;
        padding: 6px 12px;
        margin-bottom: 8px;
      }
      .deposits tr.unrecorded { border-color: rgba(192, 132, 48, 0.4); }
      .deposits td {
        display: grid;
        grid-template-columns: 6.5rem minmax(0, 1fr);
        gap: 8px;
        padding: 6px 0;
        border-top: 0;
      }
      .deposits td + td { border-top: 1px solid var(--border-soft); }
      .deposits .cell-label {
        display: block;
        font-size: 0.67rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #9ca3af;
        padding-top: 2px;
      }
    }
  </style>
</head>
<!-- No x-init calling init(): Alpine calls a component's own init() for us,
     and naming it here as well runs the bootstrap twice (vouchers#70). -->
<body class="bg-neutral-100 text-neutral-900 min-h-screen antialiased font-sans"
  x-data="deposits()" x-cloak>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="hub-header text-white">
    <div class="max-w-[1180px] mx-auto px-6 pt-10 pb-16 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6">

      <div class="flex items-center gap-4 shrink-0">
        <div class="header-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10.5h18M7 15h4"/>
          </svg>
        </div>
        <div>
          <div class="text-[0.7rem] font-semibold uppercase tracking-[0.12em] text-white/65 leading-none mb-2">Staff Portal</div>
          <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white leading-none">Group booking deposits</h1>
          <p class="text-sm text-white/75 mt-2">Every deposit paid online — upcoming bookings above past, newest paid first.</p>
        </div>
      </div>

      <nav class="flex items-center gap-1.5 flex-wrap sm:justify-end">
        <a href="/"
          class="px-4 py-2 rounded-xl border border-white/30 bg-white/[0.12] text-white hover:bg-white/[0.22] text-[0.9rem] font-semibold transition-all inline-flex items-center gap-1.5">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></span>
          Back to the hub
        </a>
      </nav>

    </div>
  </header>

  <main class="max-w-[1180px] mx-auto w-full px-4 pb-10 -mt-10">
    <div class="panel">

      <div x-show="error" class="notice notice-error mb-5" x-text="error"></div>

      <div x-show="loading" class="py-10 text-center text-sm text-neutral-500">Loading…</div>

      <template x-if="!loading && !scriptStale && !error">
        <div>
          <div x-show="!upcoming.length && !past.length" class="py-10 text-center text-sm text-neutral-500">
            No deposits have been recorded yet.
          </div>

          <!-- One table per group, upcoming above past. Same nine columns in
               both, so the rows are one template. -->
          <template x-for="(group, i) in groups" :key="group.title">
            <section :class="i ? 'mt-8' : ''">
              <h2 class="text-lg font-bold mb-3" style="color: var(--ink-primary);">
                <span x-text="group.title"></span>
                <span class="text-neutral-400 font-semibold" x-text="`· ${group.rows.length}`"></span>
              </h2>
              <table class="deposits">
                <thead>
                  <tr>
                    <th>Paid</th><th>Organiser</th><th>Email</th><th>Event</th><th>Amount</th><th>Fee</th>
                    <th>Staff email</th><th>Customer email</th><th>Payment</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="row in group.rows" :key="row.id">
                    <tr :class="{ unrecorded: !row.recorded }">
                      <td class="paid"><span class="cell-label">Paid</span><span x-text="row.paid"></span></td>
                      <td class="organiser">
                        <span class="cell-label">Organiser</span>
                        <span>
                          <span x-text="row.organiser"></span>
                          <span class="problem" x-show="row.problem" x-text="row.problem"></span>
                        </span>
                      </td>
                      <td><span class="cell-label">Email</span><span x-text="row.email"></span></td>
                      <td><span class="cell-label">Event</span><span x-text="row.event"></span></td>
                      <td class="money"><span class="cell-label">Amount</span><span x-text="row.amount"></span></td>
                      <td class="money"><span class="cell-label">Fee</span><span x-text="row.fee"></span></td>
                      <td><span class="cell-label">Staff email</span><span :class="`state-${row.staffEmail.tone}`" x-text="row.staffEmail.text"></span></td>
                      <td><span class="cell-label">Customer email</span><span :class="`state-${row.customerEmail.tone}`" x-text="row.customerEmail.text"></span></td>
                      <td class="session">
                        <span class="cell-label">Payment</span>
                        <span>
                          <a x-show="row.payment.href" :href="row.payment.href" target="_blank" rel="noopener" x-text="row.payment.label"></a>
                          <span x-show="!row.payment.href" x-text="row.payment.label"></span>
                        </span>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </section>
          </template>
        </div>
      </template>
    </div>
  </main>

  <script>
    // Same bootstrap as vouchers/unsubscribes.html. Cloudflare Access
    // authenticates every call through the proxy and no secret is needed.
    // Localhost has no Access in front of it, so it keeps the shared-secret path.
    const IS_LOCAL = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const WORKER = IS_LOCAL ? 'https://uj-payments.urbanjungle.workers.dev' : '/api/payments';

    // Every function the page depends on. Checked at boot — see init().
    const REQUIRED_LOGIC = ['perthToday', 'groupDeposits', 'shapeRow'];

    function deposits() {
      return {
        loading: true,
        error: '',
        scriptStale: false,

        upcoming: [],
        past: [],

        get groups() {
          return [
            { title: 'Upcoming', rows: this.upcoming },
            { title: 'Past', rows: this.past },
          ].filter((g) => g.rows.length);
        },

        async init() {
          const missing = REQUIRED_LOGIC.filter(
            (fn) => typeof window.depositLogic?.[fn] !== 'function',
          );
          if (missing.length) {
            this.scriptStale = true;
            this.loading = false;
            this.error = 'This page loaded an out-of-date script, so the list cannot be shown. '
              + 'Reload with Ctrl+Shift+R (Cmd+Shift+R on a Mac). '
              + `If it keeps happening, tell Jiri — missing: ${missing.join(', ')}.`;
            return;
          }

          if (IS_LOCAL) {
            const hash = window.location.hash.slice(1);
            if (hash) {
              localStorage.setItem('uj_staff_secret', hash);
              history.replaceState(null, '', window.location.pathname + window.location.search);
            }
          } else {
            localStorage.removeItem('uj_staff_secret');
          }
          await this.load();
        },

        async load() {
          this.loading = true;
          this.error = '';
          try {
            const rows = await this.api('/v1/staff/deposits');
            const logic = window.depositLogic;
            const grouped = logic.groupDeposits(Array.isArray(rows) ? rows : [], logic.perthToday());
            this.upcoming = grouped.upcoming.map(logic.shapeRow);
            this.past = grouped.past.map(logic.shapeRow);
          } catch (e) {
            this.error = `Could not load the deposits — ${e.message}`;
          } finally {
            this.loading = false;
          }
        },

        async api(path) {
          const headers = IS_LOCAL
            ? { 'X-Staff-Secret': localStorage.getItem('uj_staff_secret') || '' }
            : {};
          const res = await fetch(WORKER + path, { headers });
          if (!res.ok) {
            let msg = `${res.status}`;
            try {
              const parsed = await res.json();
              if (parsed?.error) msg += ` ${parsed.error}`;
            } catch { /* non-JSON error body — the status is enough */ }
            throw new Error(msg);
          }
          return res.json();
        },
      };
    }
  </script>
</body>
</html>
