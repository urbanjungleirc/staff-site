<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slideshow moved</title>
<!-- No-JS fallback: redirect to the canonical public slideshow. -->
<meta http-equiv="refresh" content="0; url=https://tools.urbanjungleirc.com/slideshow/">
<link rel="canonical" href="https://tools.urbanjungleirc.com/slideshow/">
<script>
  // Preserve any query string (?folder=...&autostart=1) when redirecting.
  (function () {
    var base = 'https://tools.urbanjungleirc.com/slideshow/';
    window.location.replace(base + window.location.search + window.location.hash);
  })();
</script>
<style>
  body { background: #000; color: #fff; font-family: Arial, sans-serif;
         display: flex; align-items: center; justify-content: center;
         height: 100vh; margin: 0; text-align: center; }
  a { color: #10b981; font-weight: bold; }
</style>
</head>
<body>
  <p>The slideshow has moved to<br>
    <a href="https://tools.urbanjungleirc.com/slideshow/">tools.urbanjungleirc.com/slideshow</a>.
    <noscript><br>Redirecting&hellip; if nothing happens, click the link above.</noscript>
  </p>
</body>
</html>
