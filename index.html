<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Urban Jungle Staff Tools</title>
    <meta
      name="description"
      content="Launch Urban Jungle internal tools secured behind Cloudflare Zero Trust."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f4f6;
        --bg-alt: #ffffff;
        --accent: #8b1c23;
        --accent-soft: rgba(139, 28, 35, 0.12);
        --text: #1f2937;
        --text-muted: #4b5563;
        --border: rgba(31, 41, 55, 0.08);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 56px 24px 64px;
        background: radial-gradient(circle at 20% -20%, rgba(171, 49, 57, 0.32), transparent 55%),
          linear-gradient(145deg, rgba(107, 24, 30, 0.95), rgba(139, 28, 35, 0.92));
        color: #fff;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      header p {
        margin: 16px auto 0;
        max-width: 600px;
        font-size: 1.05rem;
        color: rgba(255, 255, 255, 0.85);
      }

      main {
        flex: 1;
        width: min(1100px, calc(100% - 32px));
        margin: -48px auto 32px;
      }

      section {
        background: var(--bg-alt);
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 12px 30px -24px rgba(15, 23, 42, 1);
        border: 1px solid var(--border);
      }

      .tool-group {
        position: relative;
        border-radius: 18px;
        padding: 28px;
        background: linear-gradient(135deg, rgba(139, 28, 35, 0.06), rgba(139, 28, 35, 0));
        border: 1px solid rgba(139, 28, 35, 0.12);
        box-shadow: 0 10px 28px -24px rgba(139, 28, 35, 0.7);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .group-heading {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .group-title, .tool-name {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text);
      }

      .group-description {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .group-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .group-button {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 18px 20px;
        border-radius: 14px;
        background: var(--bg-alt);
        color: var(--accent);
        border: 1px solid rgba(139, 28, 35, 0.25);
        text-decoration: none;
        font-weight: 600;
        letter-spacing: -0.01em;
        box-shadow: 0 12px 24px -20px rgba(15, 23, 42, 0.25);
        transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease, color 150ms ease;
      }

      .group-button:hover,
      .group-button:focus-visible {
        transform: translateY(-3px);
        box-shadow: 0 18px 30px -24px rgba(15, 23, 42, 0.32);
        background: rgba(139, 28, 35, 0.08);
        color: var(--accent);
      }

      .group-button-label {
        font-size: 1rem;
      }

      .group-button-name {
        font-size: 0.85rem;
        font-weight: 500;
        opacity: 0.9;
        color: var(--text-muted);
      }

      .group-short-name {
        position: absolute;
        top: 16px;
        right: 20px;
        font-size: clamp(1.8rem, 5vw, 3.8rem);
        font-weight: 900;
        color: var(--accent);
        opacity: 0.15;
        letter-spacing: 0.08em;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        line-height: 1;
        text-transform: uppercase;
        z-index: 1;
      }

      .group-short-name img {
        display: block;
        max-width: 80px;
        max-height: 80px;
        width: auto;
        height: auto;
        object-fit: contain;
        opacity: 2;
      }

      .group-short-name svg {
        display: block;
        width: 80px;
        height: 80px;
        opacity: 2;
      }

      #tool-content > * + * {
        margin-top: 32px;
      }

      .tools-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
      }

      .tool-card {
        background: linear-gradient(135deg, rgba(139, 28, 35, 0.08), rgba(139, 28, 35, 0));
        border-radius: 16px;
        padding: 24px;
        border: 1px solid rgba(139, 28, 35, 0.12);
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .tool-card:hover,
      .tool-card:focus-within {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px -20px rgba(139, 28, 35, 0.55);
      }

      .tool-card a {
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
      }

      

      .tool-description {
        color: var(--text-muted);
        margin: 0;
        font-size: 0.95rem;
      }

      .tool-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .meta-pill {
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .loading-state,
      .empty-state,
      .error-state {
        margin: 0;
        color: var(--text-muted);
        text-align: center;
        padding: 24px 0;
      }

      footer {
        text-align: center;
        padding: 24px;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      @media (max-width: 640px) {
        header {
          padding: 48px 18px 28px;
        }

        section {
          padding: 24px;
        }

        .tool-group {
          padding: 22px;
        }

        .group-buttons {
          grid-template-columns: 1fr;
        }

        .group-button {
          padding: 16px 18px;
        }

        .group-short-name {
          top: 12px;
          right: 16px;
          font-size: 1.5rem;
          opacity: 0.06;
        }

        .group-short-name img {
          max-width: 60px;
          max-height: 60px;
          opacity: 2;
        }

        .group-short-name svg {
          width: 60px;
          height: 60px;
          opacity: 2;
        }
      }
    </style>
    <!-- n8n chat widget styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@n8n/chat@0.66.0/dist/style.css"/>
    <style>
      :root {
        --chat--color-primary: #8b1c23;
        --chat--color-primary-shade-50: #7a1820;
        --chat--color-primary-shade-100: #6b181e;
        --chat--color-secondary: #1f2937;
        --chat--color-secondary-shade-50: #111827;
        --chat--color-white: #ffffff;
        --chat--color-light: #f3f4f6;
        --chat--color-light-shade-50: #e5e7eb;
        --chat--color-light-shade-100: #d1d5db;
        --chat--color-medium: #cbd5e1;
        --chat--color-dark: #0f172a;
        --chat--color-disabled: #94a3b8;
        --chat--color-typing: #4b5563;

        --chat--spacing: 1rem;
        --chat--border-radius: 14px;
        --chat--transition-duration: 0.18s;
        /* --chat--font-family: ("Inter", "Segoe UI", system-ui, -apple-system, sans-serif); */

        --chat--window--width: 380px;
        --chat--window--height: 560px;
        --chat--window--bottom: 20px;
        --chat--window--right: 20px;
        --chat--window--z-index: 9999;
        --chat--window--border: 1px solid rgba(139, 28, 35, 0.12);
        --chat--window--border-radius: 16px;
        --chat--window--margin-bottom: 0;

        --chat--header-height: auto;
        --chat--header--padding: 16px 18px;
        --chat--header--background: linear-gradient(145deg, #6b181e, #8b1c23);
        --chat--header--color: #ffffff;
        --chat--heading--font-size: 1.2rem;
        --chat--subtitle--font-size: 0.95rem;
        --chat--subtitle--line-height: 1.5;

        --chat--message--font-size: 1rem;
        --chat--message--padding: 0.9rem 1rem;
        --chat--message--border-radius: 12px;
        --chat--message-line-height: 1.55;
        --chat--message--margin-bottom: 0.75rem;
        --chat--message--bot--background: #ffffff;
        --chat--message--bot--color: #1f2937;
        --chat--message--bot--border: 1px solid rgba(15, 23, 42, 0.05);
        --chat--message--user--background: #8b1c23;
        --chat--message--user--color: #ffffff;
        --chat--message--user--border: none;
        --chat--message--pre--background: rgba(15, 23, 42, 0.04);
        --chat--messages-list--padding: 1rem;

        --chat--toggle--size: 64px;
        --chat--toggle--background: #8b1c23;
        --chat--toggle--hover--background: #7a1820;
        --chat--toggle--active--background: #6b181e;
        --chat--toggle--color: #ffffff;

        --chat--textarea--height: 54px;
        --chat--textarea--max-height: 30rem;
        --chat--input--font-size: 1rem;
        --chat--input--padding: 0.85rem 1rem;
        --chat--input--background: #ffffff;
        --chat--input--text-color: #1f2937;
        --chat--input--border: 1px solid #e5e7eb;
        --chat--input--border-active: 1px solid rgba(139, 28, 35, 0.35);
        --chat--input--left--panel--width: 2.2rem;

        --chat--button--color: #ffffff;
        --chat--button--background: #8b1c23;
        --chat--button--padding: 0.65rem 1rem;
        --chat--button--border-radius: 12px;
        --chat--button--hover--color: #ffffff;
        --chat--button--hover--background: #7a1820;
        --chat--close--button--color-hover: #8b1c23;

        --chat--input--send--button--background: #ffffff;
        --chat--input--send--button--color: #8b1c23;
        --chat--input--send--button--background-hover: rgba(139, 28, 35, 0.08);
        --chat--input--send--button--color-hover: #6b181e;
        --chat--input--file--button--background: #ffffff;
        --chat--input--file--button--color: #1f2937;
        --chat--input--file--button--background-hover: #ffffff;
        --chat--input--file--button--color-hover: #111827;
        --chat--files-spacing: 0.35rem;

        --chat--body--background: #f8fafc;
        --chat--footer--background: #f8fafc;
        --chat--footer--color: #1f2937;
      }

      .chat-message {
        max-width: 68%;
      }
      main.chat-layout {
        margin: 0;
      }
      .chat-window {
        box-shadow: 0 12px 30px -20px rgba(139, 28, 35, 0.55);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Urban Jungle Staff Hub</h1>
      <p>Launch the internal tools you need every day. Access is restricted to Urban Jungle staff.</p>
    </header>

    <main>
      <section aria-labelledby="tools-heading">
        <h2 id="tools-heading" style="margin-top: 0; margin-bottom: 24px; font-size: 1.25rem">
          Available Tools
        </h2>
        <div id="tool-content">
          <p class="loading-state" role="status">Loading tools…</p>
        </div>
      </section>
    </main>

    <footer>Questions or missing something? Reach out to the digital team.</footer>

    <script>
      // Config for tools and API
      // TEMPORARY: Testing with local file to debug description display issue
      window.TOOLS_JSON_URL = 'tools.json';
      // window.TOOLS_JSON_URL = 'https://raw.githubusercontent.com/urbanjungleirc/staff-site/main/tools.json';
      // Route your Worker to ujstaff.happyk.au/api/* so this relative base works
      window.WORKER_API_BASE = '/api';
      async function loadTools() {
        const container = document.getElementById("tool-content");
        try {
          const toolsUrl = window.TOOLS_JSON_URL || "tools.json";
          const response = await fetch(toolsUrl, { cache: "no-store" });
          if (!response.ok) throw new Error("Unable to fetch tools");

          const payload = await response.json();

          const assembledEntries = [];

          if (Array.isArray(payload?.entries)) {
            assembledEntries.push(...payload.entries);
          } else {
            if (Array.isArray(payload?.groups)) {
              for (const group of payload.groups) {
                assembledEntries.push({ type: "group", ...group });
              }
            }
            if (Array.isArray(payload?.tools)) {
              for (const tool of payload.tools) {
                assembledEntries.push({ type: "tool", ...tool });
              }
            }
          }

          if (!assembledEntries.length) {
            container.innerHTML =
              '<p class="empty-state" role="status">No tools are published here yet.</p>';
            return;
          }

          const fragment = document.createDocumentFragment();
          let pendingGrid = null;
          const flushGrid = () => {
            if (pendingGrid?.childElementCount) {
              fragment.appendChild(pendingGrid);
            }
            pendingGrid = null;
          };

          let hasRenderableContent = false;

          for (const entry of assembledEntries) {
            if (!entry || typeof entry !== "object") continue;
            const type = String(entry.type ?? "").toLowerCase();

            if (type === "group") {
              const items = Array.isArray(entry.items)
                ? entry.items.filter((item) => item?.path)
                : [];
              if (!items.length) continue;

              flushGrid();
              const groupCard = document.createElement("article");
              groupCard.className = "tool-group";
              if (entry.id) {
                groupCard.setAttribute("data-group-id", entry.id);
              }

              const heading = document.createElement("div");
              heading.className = "group-heading";

              const title = document.createElement("h3");
              title.className = "group-title";
              title.textContent = entry.name ?? "Tool Group";
              heading.appendChild(title);

              if (entry.description) {
                const blurb = document.createElement("p");
                blurb.className = "group-description";
                blurb.textContent = entry.description;
                heading.appendChild(blurb);
              }

              groupCard.appendChild(heading);

              // Add decorative shortName if present
              if (entry.shortName) {
                const shortName = document.createElement("div");
                shortName.className = "group-short-name";
                shortName.setAttribute("aria-hidden", "true");

                // Detect if shortName is an image URL or SVG
                if (entry.shortName.match(/\.(svg|png|jpg|jpeg|gif|webp)$/i)) {
                  // Image shortName
                  const img = document.createElement("img");
                  img.src = entry.shortName;
                  img.alt = "";
                  shortName.appendChild(img);
                } else if (entry.shortName.trim().startsWith('<svg')) {
                  // Inline SVG shortName
                  shortName.innerHTML = entry.shortName;
                } else {
                  // Text shortName
                  shortName.textContent = entry.shortName;
                }

                groupCard.appendChild(shortName);
              }

              const buttons = document.createElement("div");
              buttons.className = "group-buttons";

              for (const item of items) {
                const button = document.createElement("a");
                button.className = "group-button";
                button.href = item.path;

                if (item.id || item.buttonText) {
                  const identifier =
                    item.id ??
                    (typeof item.buttonText === "string"
                      ? item.buttonText.toLowerCase().replace(/\s+/g, "-")
                      : undefined);
                  if (identifier) {
                    button.setAttribute("data-tool-id", identifier);
                  }
                }

                const label = document.createElement("span");
                label.className = "group-button-label";
                label.textContent =
                  item.buttonText ??
                  (item.description ? `Open ${item.description}` : "Open tool");
                button.appendChild(label);

                if (item.description) {
                  const description = document.createElement("span");
                  description.className = "group-button-name";
                  description.textContent = item.description;
                  button.appendChild(description);
                }

                buttons.appendChild(button);
              }

              groupCard.appendChild(buttons);
              fragment.appendChild(groupCard);
              hasRenderableContent = true;
            } else if (type === "tool") {
              if (!entry.path || !entry.name) continue;

              if (!pendingGrid) {
                pendingGrid = document.createElement("div");
                pendingGrid.className = "tools-grid";
              }

              const card = document.createElement("article");
              card.className = "tool-card";

              const link = document.createElement("a");
              link.href = entry.path;
              link.setAttribute(
                "data-tool-id",
                entry.id ?? entry.name.toLowerCase()
              );

              const name = document.createElement("h3");
              name.className = "tool-name";
              name.textContent = entry.name;

              const description = document.createElement("p");
              description.className = "tool-description";
              description.textContent =
                entry.description ?? "Launch the tool.";

              link.append(name, description);

              if (entry.category || entry.status) {
                const meta = document.createElement("div");
                meta.className = "tool-meta";
                if (entry.category) {
                  const pill = document.createElement("span");
                  pill.className = "meta-pill";
                  pill.textContent = entry.category;
                  meta.appendChild(pill);
                }
                if (entry.status) {
                  const pill = document.createElement("span");
                  pill.className = "meta-pill";
                  pill.textContent = entry.status;
                  meta.appendChild(pill);
                }
                link.appendChild(meta);
              }

              card.appendChild(link);
              pendingGrid.appendChild(card);
              hasRenderableContent = true;
            }
          }

          flushGrid();

          if (!hasRenderableContent) {
            container.innerHTML =
              '<p class="empty-state" role="status">No tools are published here yet.</p>';
            return;
          }

          container.replaceChildren(fragment);
        } catch (error) {
          console.error(error);
          container.innerHTML =
            '<p class="error-state" role="alert">We ran into a problem loading the tools. Please refresh or try again later.</p>';
        }
      }

      loadTools();

      // Lightweight inline editor (only appears when `?admin` is present and WORKER_API_BASE is set)
      (function initEditor() {
        const params = new URLSearchParams(location.search);
        const apiBase = (window.WORKER_API_BASE || '').replace(/\/$/, '');
        if (!params.has('admin') || !apiBase) return;

        const btn = document.createElement('button');
        btn.textContent = 'Edit tools.json';
        btn.style.position = 'fixed';
        btn.style.bottom = '16px';
        btn.style.right = '16px';
        btn.style.zIndex = '9999';
        btn.style.padding = '10px 14px';
        btn.style.borderRadius = '10px';
        btn.style.border = '1px solid rgba(139,28,35,0.3)';
        btn.style.background = 'white';
        btn.style.color = '#8b1c23';
        btn.style.fontWeight = '600';
        btn.style.boxShadow = '0 8px 20px -12px rgba(15,23,42,0.35)';

        const modal = document.createElement('div');
        Object.assign(modal.style, {
          position: 'fixed', inset: '0', background: 'rgba(0,0,0,0.4)',
          display: 'none', alignItems: 'center', justifyContent: 'center', zIndex: '10000'
        });
        const panel = document.createElement('div');
        Object.assign(panel.style, {
          width: 'min(900px, 96vw)', maxHeight: '90vh', background: 'white', color: '#111',
          borderRadius: '14px', border: '1px solid rgba(0,0,0,0.1)', display: 'flex', flexDirection: 'column'
        });
        const header = document.createElement('div');
        header.textContent = 'Edit tools.json';
        Object.assign(header.style, {
          padding: '12px 16px', borderBottom: '1px solid rgba(0,0,0,0.08)',
          fontWeight: '700', color: '#8b1c23'
        });
        const ta = document.createElement('textarea');
        Object.assign(ta.style, {
          width: '100%', height: '50vh', flex: '1 1 auto', border: 'none', outline: 'none',
          padding: '12px 16px', fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
        });
        const bar = document.createElement('div');
        Object.assign(bar.style, { padding: '12px 16px', display: 'flex', gap: '8px', justifyContent: 'flex-end', borderTop: '1px solid rgba(0,0,0,0.08)' });
        const status = document.createElement('div');
        status.style.marginRight = 'auto';
        status.style.color = '#4b5563';
        const close = document.createElement('button'); close.textContent = 'Close';
        const save = document.createElement('button'); save.textContent = 'Save';
        for (const b of [close, save]) {
          Object.assign(b.style, { padding: '8px 12px', borderRadius: '10px', border: '1px solid rgba(0,0,0,0.12)', background: 'white', cursor: 'pointer', fontWeight: 600 });
        }
        save.style.background = 'linear-gradient(145deg, rgba(107,24,30,0.95), rgba(139,28,35,0.92))';
        save.style.color = 'white';

        bar.append(status, close, save);
        panel.append(header, ta, bar);
        modal.append(panel);
        document.body.append(btn, modal);

        async function openEditor() {
          modal.style.display = 'flex';
          status.textContent = 'Loading...';
          try {
            const res = await fetch(apiBase + '/tools.json', { cache: 'no-store', credentials: 'include' });
            if (!res.ok) throw new Error('Fetch failed: ' + res.status);
            const text = await res.text();
            ta.value = text;
            status.textContent = 'Loaded';
          } catch (e) {
            status.textContent = 'Error loading: ' + (e?.message || e);
          }
        }
        async function saveEditor() {
          status.textContent = 'Saving...';
          try {
            let parsed;
            try { parsed = JSON.parse(ta.value); } catch (e) { throw new Error('Invalid JSON: ' + e.message); }
            const res = await fetch(apiBase + '/tools.json', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(parsed),
              credentials: 'include',
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data?.error || ('Save failed: ' + res.status));
            status.textContent = 'Saved. You may need to refresh to see published changes.';
          } catch (e) {
            status.textContent = 'Error: ' + (e?.message || e);
          }
        }
        btn.addEventListener('click', openEditor);
        close.addEventListener('click', () => { modal.style.display = 'none'; });
        save.addEventListener('click', saveEditor);
      })();
    </script>

        i18n: {

            inputPlaceholder: 'Ask about policies, tools, or workflows…',

        },
      });
    </script>
