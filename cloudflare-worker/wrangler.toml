name = "uj-tools-editor"
main = "src/index.js"
compatibility_date = "2024-10-01"

# Cloudflare account ID (j.happyk@gmail.com)
account_id = "7b9239b4304637147e3e26d2ceb27666"

# Optionally bind a route (if using a custom domain proxied by Cloudflare)
# Recommended for this site:
# routes = [
#   { pattern = "ujstaff.happyk.au/api/*", zone_id = "YOUR_ZONE_ID" }
# ]

[vars]
# GitHub owner and repo (without .git)
GITHUB_OWNER = "urbanjungleirc"
GITHUB_REPO = "staff-site"
GITHUB_BRANCH = "main"
# Path of the json file in the repo root by default
TOOLS_PATH = "tools.json"

# Lock CORS to your site origin
ALLOWED_ORIGIN = "https://ujstaff.happyk.au"

# Optional committer/author metadata
COMMITTER_NAME = "UJ Tools Editor"
COMMITTER_EMAIL = "devnull+uj-tools@happyk.au"

# Deputy API base URL (no trailing slash)
DEPUTY_URL = "https://8fbf4e19073503.au.deputy.com/api/v1"

# How many days before/after today to fetch from Deputy
DEPUTY_WINDOW_PAST_DAYS = "30"
DEPUTY_WINDOW_FUTURE_DAYS = "30"

# Secrets (set via `wrangler secret put`):
# - GITHUB_TOKEN: Fine-grained PAT with repo contents:read/write, or a GitHub App installation token
# - DEPUTY_TOKEN: Deputy permanent API token (Settings → API → Permanent Tokens)
#   Run: wrangler secret put DEPUTY_TOKEN
